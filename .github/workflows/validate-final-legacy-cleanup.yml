name: Final Legacy Cleanup Validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict stable validation
        env:
          RELEASE_TAG: 0.3.0
          RELEASE_STRICT: '1'
        run: npm run release:check:strict
      - name: Commit rebuilt bundle and remove one-shot validator
        shell: bash
        run: |
          rm .github/workflows/validate-final-legacy-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/validate-final-legacy-cleanup.yml
          git commit -m "build: validate final legacy cleanup"
          git push origin HEAD:${GITHUB_REF_NAME}
