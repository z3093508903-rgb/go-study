name: Package Stable Migration Test V2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify stable bundle
        env:
          RELEASE_TAG: 0.3.0
          RELEASE_STRICT: '1'
        run: npm run release:check:strict

      - name: Build fixed migration package
        shell: bash
        run: |
          rm -rf dist-test
          mkdir -p dist-test/go-study
          cp main.js manifest.json styles.css dist-test/go-study/
          cat > dist-test/go-study/INSTALL-TEST.txt <<'EOF'
          Go Study 0.3.0 Stable Migration Test V2

          Fix:
          - Stable workbench view type is now go-study-workbench.
          - Restores project Notes Box / Continue Learning injection and workbench learning controls after changing plugin id from go-study-preview to go-study.

          Your migrated data is not deleted. Existing stable go-study/data.json can remain in place.

          Upgrade:
          1. Disable Go Study in Obsidian.
          2. Replace main.js, manifest.json, styles.css in <Vault>/.obsidian/plugins/go-study/ with this package.
          3. Reload Obsidian and enable Go Study.
          4. Open a project. Confirm the Notes button / Notes Box is visible again.
          5. Confirm your existing linked notes are present.
          6. Fully restart Obsidian once.
          EOF
          cd dist-test
          zip -qr go-study-0.3.0-stable-migration-test-v2.zip go-study
          sha256sum go-study-0.3.0-stable-migration-test-v2.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: go-study-0.3.0-stable-migration-test-v2
          path: |
            dist-test/go-study-0.3.0-stable-migration-test-v2.zip
            dist-test/SHA256SUMS.txt
          retention-days: 7

      - name: Remove one-shot packager
        shell: bash
        run: |
          rm .github/workflows/package-stable-migration-test-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/package-stable-migration-test-v2.yml
          git commit -m "ci: remove one-shot stable migration V2 packager"
          git push origin HEAD:${GITHUB_REF_NAME}
