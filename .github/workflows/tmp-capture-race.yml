name: Temporary Capture Race Repair
on:
  push:
    branches:
      - 'work/20260913-chatgpt-capture-metadata-race'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/20260913-chatgpt-capture-metadata-race
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repair
        run: python scripts/tmp_patch_capture_race.py
      - name: Focused tests
        run: node --test tests/learning-capture.test.cjs tests/bilibili-metadata.test.cjs
      - name: Build bundle
        run: node build.mjs
      - name: Commit repair and remove helpers
        run: |
          rm scripts/tmp_patch_capture_race.py .github/workflows/tmp-capture-race.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests main.js scripts .github/workflows
          git commit -m 'fix: protect capture from metadata lookup races'
          git push origin HEAD:work/20260913-chatgpt-capture-metadata-race
