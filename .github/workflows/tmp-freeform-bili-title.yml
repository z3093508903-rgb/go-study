name: Temporary Freeform Bilibili Title Repair

on:
  push:
    branches:
      - work/20260913-chatgpt-freeform-bilibili-title

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/20260913-chatgpt-freeform-bilibili-title
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply scoped repair
        run: python scripts/tmp_apply_freeform_bili_title.py

      - name: Run focused tests
        run: node --test tests/bilibili-metadata.test.cjs tests/learning-capture.test.cjs tests/timeline-navigator.test.cjs

      - name: Rebuild committed bundle
        run: npm run build

      - name: Remove temporary helpers and commit repair
        shell: bash
        run: |
          git rm .github/workflows/tmp-freeform-bili-title.yml scripts/tmp_apply_freeform_bili_title.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs main.js
          git commit -m "fix: enrich Freeform Bilibili timeline titles"
          git push origin HEAD:work/20260913-chatgpt-freeform-bilibili-title
