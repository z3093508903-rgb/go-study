name: Temporary State Safety Repair
on:
  push:
    branches:
      - 'work/20260913-chatgpt-state-safety-protection-result'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/20260913-chatgpt-state-safety-protection-result
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repair
        run: python scripts/tmp_patch_state_safety.py
      - name: Focused tests
        run: node --test tests/state-safety.test.cjs tests/state-safety-integration.test.cjs
      - name: Build bundle
        run: node build.mjs
      - name: Commit repair and remove helpers
        run: |
          rm scripts/tmp_patch_state_safety.py .github/workflows/tmp-state-safety.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests main.js scripts .github/workflows
          git commit -m 'fix: make state protection failures explicit'
          git push origin HEAD:work/20260913-chatgpt-state-safety-protection-result
