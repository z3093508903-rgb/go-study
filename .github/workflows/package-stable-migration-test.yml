name: Package Stable Migration Test

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build migration test package
        shell: bash
        run: |
          rm -rf dist-test
          mkdir -p dist-test/go-study
          cp main.js manifest.json styles.css dist-test/go-study/
          cat > dist-test/go-study/INSTALL-TEST.txt <<'EOF'
          Go Study 0.3.0 Stable Migration Test

          Purpose:
          - Final real-machine validation of go-study-preview -> go-study data migration.
          - Permanent plugin id: go-study.

          Install:
          1. Keep your existing go-study-preview folder/data in place.
          2. Extract this go-study folder into:
             <Vault>/.obsidian/plugins/go-study/
          3. Reload Obsidian and enable Go Study.
          4. Verify projects/resources/settings were migrated.
          5. Fully close and reopen Obsidian once more.
          6. Only after confirming stable data is correct, disable the Preview plugin.

          Expected:
          - Go Study reports Preview data was safely migrated.
          - Original Preview data.json remains unchanged.
          - A saved-preview-migration-... recovery backup is created.
          EOF
          cd dist-test
          zip -qr go-study-0.3.0-stable-migration-test.zip go-study
          sha256sum go-study-0.3.0-stable-migration-test.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: go-study-0.3.0-stable-migration-test
          path: |
            dist-test/go-study-0.3.0-stable-migration-test.zip
            dist-test/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-shot packager
        shell: bash
        run: |
          rm .github/workflows/package-stable-migration-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/package-stable-migration-test.yml
          git commit -m "ci: remove one-shot migration test packager"
          git push origin HEAD:${GITHUB_REF_NAME}
