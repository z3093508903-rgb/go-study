name: Temporary V1 Cleanup Bundle Rebuild

on:
  push:
    branches:
      - 'work/20260913-chatgpt-drop-v1-backlinks'

permissions:
  contents: write

jobs:
  rebuild-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/20260913-chatgpt-drop-v1-backlinks

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild committed bundle
        run: npm run build

      - name: Commit generated main.js if changed
        shell: bash
        run: |
          if git diff --quiet -- main.js; then
            echo "main.js is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "build: refresh main.js after v1 cleanup"
          git push origin HEAD:work/20260913-chatgpt-drop-v1-backlinks
